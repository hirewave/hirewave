global:
  resolve_timeout: 1m

route:
  group_by: ['alertname', 'severity']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1m
  receiver: 'email'
  
receivers:
- name: 'email'
  email_configs:
  - to: 'placeholder@icloud.com'
    from: 'placeholder@gmail.com'
    smarthost: smtp.gmail.com:587
    auth_username: 'placeholder@gmail.com'
    auth_identity: 'placeholder@gmail.com'
    auth_password: 'placeholder'

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alert_group']
